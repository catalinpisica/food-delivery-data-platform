services:
  postgres:
    image: postgres:16
    container_name: food_delivery_postgres
    command:
      - postgres
      - -c
      - wal_level=logical
    environment:
      POSTGRES_DB: food_delivery
      POSTGRES_USER: food_delivery_user
      POSTGRES_PASSWORD: food_delivery_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d

  redpanda:
    image: redpandadata/redpanda:v24.2.18
    container_name: food_delivery_redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
      - "9644:9644"
  
  debezium:
    image: debezium/connect:2.7.3.Final
    container_name: food_delivery_debezium
    depends_on:
      - postgres
      - redpanda
    environment:
      BOOTSTRAP_SERVERS: redpanda:9092
      GROUP_ID: food_delivery_debezium
      CONFIG_STORAGE_TOPIC: debezium_configs
      OFFSET_STORAGE_TOPIC: debezium_offsets
      STATUS_STORAGE_TOPIC: debezium_statuses
    ports:
      - "8083:8083"

volumes:
  postgres_data: